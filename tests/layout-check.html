<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificação de larguras do Oss Timer</title>
  <style>
    .case { margin-bottom: 1rem; }
    iframe { display: block; height: 390px; border: 1px solid #777; }
    #resultados { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Verificação de larguras</h1>
  <pre id="resultados">aguardando...</pre>
  <script>
    (function () {
      var tamanhos = [
        { nome: "320", largura: 320, altura: 568 },
        { nome: "360", largura: 360, altura: 640 },
        { nome: "390", largura: 390, altura: 844 },
        { nome: "768", largura: 768, altura: 1024 },
        { nome: "1024", largura: 1024, altura: 768 },
        { nome: "844x390", largura: 844, altura: 390 }
      ];
      var pendentes = tamanhos.length;
      var resultados = [];

      function medir(frame, caso) {
        try {
          var doc = frame.contentDocument;
          var win = frame.contentWindow;
          var raiz = doc.documentElement;
          var semRolagem = raiz.scrollWidth <= raiz.clientWidth;
          var textosCortados = Array.from(doc.querySelectorAll("h1, p, button")).some(function (elemento) {
            if (elemento.hidden || !elemento.offsetParent) return false;
            return elemento.scrollWidth > elemento.clientWidth + 1 ||
              elemento.scrollHeight > elemento.clientHeight + 1;
          });
          var alvosPequenos = Array.from(doc.querySelectorAll("button")).filter(function (elemento) {
            if (elemento.hidden || !elemento.offsetParent) return false;
            var caixa = elemento.getBoundingClientRect();
            return caixa.width < 44 || caixa.height < 44;
          }).map(function (elemento) { return elemento.id || elemento.textContent.trim(); });
          resultados.push({
            largura: caso.nome,
            ok: semRolagem && !textosCortados && alvosPequenos.length === 0,
            rolagemHorizontal: !semRolagem,
            textoCortado: textosCortados,
            alvosPequenos: alvosPequenos
          });
        } catch (erro) {
          resultados.push({ largura: caso.nome, ok: false, erro: erro.name + ": " + erro.message });
        }
        pendentes -= 1;
        if (!pendentes) document.getElementById("resultados").textContent = JSON.stringify(resultados, null, 2);
      }

      tamanhos.forEach(function (caso) {
        var frame = document.createElement("iframe");
        frame.style.width = caso.largura + "px";
        frame.style.height = caso.altura + "px";
        frame.src = "../index.html";
        frame.addEventListener("load", function () { setTimeout(function () { medir(frame, caso); }, 100); });
        document.body.appendChild(frame);
      });
    }());
  </script>
</body>
</html>
