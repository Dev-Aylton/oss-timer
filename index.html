<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oss Timer">
  <title>Oss Timer</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.errosApp = [];
    window.addEventListener("error", function (evento) {
      window.errosApp.push(String(evento.message || evento.error || evento.type));
    });
  </script>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="timer-engine.js" defer></script>
  <script src="app-ui.js" defer></script>
  <script src="audio.js" defer></script>
  <script src="voice.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app" id="app" data-phase="preparar" data-status="parado">
    <header class="topbar">
      <p class="brand">OSS TIMER</p>
    </header>

    <main class="timer-area view" id="timer-view" aria-live="polite">
      <h1 class="phase-name" id="phase-name">Preparar</h1>
      <div class="timer-display" id="timer-display" role="timer">
        00:10
      </div>
      <div class="round-info" aria-label="Progresso do treino">
        <p id="round-label">Ronda 1 de 10</p>
        <p id="cycle-label">Ciclo 1 de 1</p>
      </div>
    </main>

    <footer class="controls">
      <p class="total-card">Tempo restante <strong id="total-remaining">55:25</strong></p>
      <div class="button-row">
        <button class="control-button primary" id="toggle-timer" type="button">Iniciar</button>
        <button class="control-button" id="previous-phase" type="button">Fase anterior</button>
        <button class="control-button" id="skip-phase" type="button">Pular</button>
        <button class="control-button" id="reset-timer" type="button">Reiniciar</button>
        <button class="control-button primary" id="repeat-timer" type="button" hidden>Repetir</button>
      </div>
    </footer>
  </div>
  <main class="tab-view" id="treinos-view" hidden>
    <div class="tab-heading"><h1>Treinos</h1><button id="novo-treino" class="secondary-button" type="button">Novo treino</button></div>
    <div id="treino-lista" class="treino-lista"></div>
    <form id="treino-editor" class="treino-editor" hidden></form>
    <section class="backup">
      <h2>Backup</h2>
      <div class="backup-actions">
        <button id="exportar-json" type="button">Exportar JSON</button>
        <button id="copiar-json" type="button">Copiar JSON</button>
        <label class="file-button" for="importar-json">Importar JSON</label>
        <input id="importar-json" type="file" accept=".json,application/json">
      </div>
      <p id="storage-mensagem" class="mensagem" role="status" aria-live="polite"></p>
    </section>
  </main>
  <main class="tab-view livre-view" id="livre-view" hidden>
    <h1>Livre</h1><div class="livre-tempo" id="livre-tempo" role="timer">00:00</div>
    <div class="livre-controles">
      <button id="livre-toggle" type="button">Iniciar</button>
      <button id="livre-reset" type="button">Zerar</button>
    </div>
    <p id="livre-status" class="mensagem" role="status" aria-live="polite"></p>
  </main>
  <main class="tab-view" id="historico-view" hidden>
    <div class="tab-heading"><h1>Histórico</h1><button id="historico-limpar" type="button">Limpar tudo</button></div>
    <div id="historico-lista"></div>
    <p id="historico-status" class="mensagem" role="status" aria-live="polite"></p>
  </main>
  <main class="tab-view" id="ajustes-view" hidden>
    <h1>Ajustes</h1>
    <div class="ajuste voz-ajuste">
      <label for="ajuste-voz">Voz</label><input id="ajuste-voz" type="checkbox">
      <label for="voz-selecao">Voz em português</label>
      <select id="voz-selecao"></select>
      <button id="testar-voz" type="button">Testar voz</button>
      <span id="status-voz" role="status" aria-live="polite">Voz: indisponível</span>
    </div>
    <label class="ajuste"><span>Bipes</span><input id="ajuste-bipes" type="checkbox"><span id="status-bipes">Bipes</span></label>
    <label class="ajuste"><span>Tela sempre ligada</span><input id="ajuste-wake" type="checkbox"><span id="status-wake">Tela sempre ligada: indisponível neste aparelho</span></label>
    <section class="sobre"><h2>Sobre</h2><p>Oss Timer</p><p>Feito por Aylton</p><p id="app-version"></p><a href="https://github.com/Dev-Aylton" target="_blank" rel="noopener noreferrer">GitHub</a></section>
  </main>
  <nav class="tab-bar" aria-label="Navegação principal">
    <button data-tab="timer-view" type="button">Timer</button>
    <button data-tab="treinos-view" type="button" aria-current="page">Treinos</button>
    <button data-tab="livre-view" type="button">Livre</button>
    <button data-tab="historico-view" type="button">Histórico</button>
    <button data-tab="ajustes-view" type="button">Ajustes</button>
  </nav>
</body>
</html>
